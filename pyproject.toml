[project]
name = "interactive-cv-pipeline"
version = "0.1.0"
description = "Interactive computer vision pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.6",
    "numpy>=2.3.3",
    "opencv-python-headless>=4.11.0.86",
    "pillow>=11.3.0",
    "scikit-image>=0.25.2",
    "streamlit>=1.50.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.2",
    "pip-audit>=2.10.0",
    "pytest>=8.4.2",
]
