# Formats the uploader accepts. Dropped tiff, netpbm, pxm, sr, jpe.
[image]
title = "Types of Images"
types = [
    "bmp",
    "jpeg",
    "jpg",
    "png",
]
# Rejected above these. Checked from the header before decoding.
max_size_mb = 5
max_megapixels = 40
max_side_px = 8000
# Downscaled to this after decoding.
target_side_px = 2560
# Max layers in the pipeline. Each layer holds two copies of the image.
max_layers = 16
